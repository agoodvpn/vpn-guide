<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "zh-CN" }}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10241f">
  {% seo %}
  <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  {% include head-custom.html %}
</head>
<body class="{% if page.url == '/' %}home{% else %}article-page{% endif %}">
  <a class="skip-link" href="#main-content">跳到正文</a>
  <div class="reading-progress" aria-hidden="true"><span></span></div>

  <header class="site-header" data-site-header>
    <div class="header-inner">
      <a class="brand" href="{{ "/" | relative_url }}" aria-label="VPN指南首页">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span class="brand-copy">
          <strong>VPN指南</strong>
          <small>连接 · 隐私 · 加速指南</small>
        </span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false"
              aria-controls="site-navigation" aria-label="打开导航菜单">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-navigation" aria-label="主要导航">
        <a href="{{ "/what-is-vpn.html" | relative_url }}">VPN入门</a>
        <a href="{{ "/how-to-choose-vpn.html" | relative_url }}">怎么选</a>
        <a href="{{ "/vpn-not-working.html" | relative_url }}">故障排查</a>
        <a href="{{ "/vpn-safe.html" | relative_url }}">隐私安全</a>
        <a href="{{ "/huyue-accelerator.html" | relative_url }}">虎跃加速器</a>
      </nav>
    </div>
  </header>

  <div class="page-frame">
    <main class="site-main" id="main-content">
      <article class="content-body">{{ content }}</article>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <a class="footer-brand" href="{{ "/" | relative_url }}">VPN指南</a>
        <p>把 VPN、网络隐私和连接问题讲清楚，少一点口号，多一点能实际操作的判断。</p>
      </div>
      <nav aria-label="页脚导航">
        <a href="{{ "/what-is-vpn.html" | relative_url }}">VPN是什么</a>
        <a href="{{ "/vpn-vs-accelerator.html" | relative_url }}">VPN与加速器</a>
        <a href="{{ "/dedicated-ip-vs-shared-ip.html" | relative_url }}">固定IP与独享IP</a>
        <a href="{{ "/about.html" | relative_url }}">关于本站</a>
      </nav>
    </div>
    <div class="footer-bottom">内容仅供一般信息参考。使用相关服务前，请遵守所在地法律及服务条款。</div>
  </footer>

  <script>
    (function () {
      var header = document.querySelector("[data-site-header]");
      var toggle = document.querySelector(".menu-toggle");
      var nav = document.getElementById("site-navigation");
      var progress = document.querySelector(".reading-progress span");
      function update() {
        var top = window.scrollY || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - window.innerHeight;
        header.classList.toggle("is-scrolled", top > 12);
        progress.style.transform = "scaleX(" + (height > 0 ? Math.min(top / height, 1) : 0) + ")";
      }
      toggle.addEventListener("click", function () {
        var open = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!open));
        toggle.setAttribute("aria-label", open ? "打开导航菜单" : "关闭导航菜单");
        nav.classList.toggle("is-open", !open);
      });
      window.addEventListener("scroll", update, { passive: true });
      update();
    }());
  </script>
</body>
</html>
